<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>💖 Dla Ciebie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
:root{
  /* ===== paleta: nokturn / rose-gold ===== */
  --bg1:#0a0512;
  --bg2:#1b0e2c;
  --bg3:#2d1642;
  --gold:#e6b98d;
  --amber:#ffb37a;
  --rose:#ff8fa8;
  --text:#f7ecff;
  --muted:#cdb8dd;

  --glassBorder: rgba(230,185,141,.28);
  --glassFill: rgba(255,255,255,.06);

  --paper:#fbf3ea;
  --paperText:#2a1710;
  --paper-title: clamp(30px, 6vw, 54px);
  --paper-font:  clamp(17px, 3.4vw, 23px);

  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  overflow:visible;
  font-family:Poppins,system-ui,sans-serif;
  background:var(--bg1);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}

/* ===== TŁO: wideo + aurora + cząstki ===== */
#bgVideo{
  position:fixed; inset:0; width:100%; height:100%;
  object-fit:cover; z-index:0; opacity:0;
  transition:opacity 1.6s ease;
  filter:saturate(1.08) contrast(1.04) brightness(.92);
}

.auroraLayer{
  position:fixed; inset:0; z-index:1; overflow:hidden;
  pointer-events:none;
}
.aurora{
  position:absolute;
  width:60vmax; height:60vmax;
  border-radius:50%;
  filter:blur(70px);
  opacity:.55;
  mix-blend-mode:screen;
}
.aurora.a1{ background:radial-gradient(circle, #ff8fa8, transparent 65%); top:-18%; left:-14%; animation:driftA 26s ease-in-out infinite; }
.aurora.a2{ background:radial-gradient(circle, #e6b98d, transparent 65%); bottom:-22%; right:-10%; animation:driftB 32s ease-in-out infinite; }
.aurora.a3{ background:radial-gradient(circle, #7a4ea8, transparent 65%); top:30%; right:20%; animation:driftC 38s ease-in-out infinite; }

@keyframes driftA{ 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(6%,8%) scale(1.12)} }
@keyframes driftB{ 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-7%,-5%) scale(1.08)} }
@keyframes driftC{ 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-5%,9%) scale(1.15)} }

#emberCanvas{
  position:fixed; inset:0; z-index:2; pointer-events:none;
}

@media (prefers-reduced-motion: reduce){
  .aurora{ animation:none !important; }
}

/* spotlight podążający za kursorem (desktop) */
.spotlight{
  position:fixed; inset:0; z-index:3; pointer-events:none;
  background:radial-gradient(420px circle at var(--sx,50%) var(--sy,40%), rgba(230,185,141,.10), transparent 60%);
  opacity:0; transition:opacity .6s ease;
}
.spotlight.on{ opacity:1; }

/* ===== ETAPY ===== */
.stage{
  position:fixed; inset:0;
  display:grid; place-items:center;
  z-index:10; pointer-events:auto;
}
.hidden{display:none !important}

/* ETAP 1 */
.stage1{ background:transparent; }

.seal{
  position:relative;
  width:clamp(200px,52vw,300px);
  height:clamp(200px,52vw,300px);
  display:grid; place-items:center;
}
.sealRing{
  position:absolute; inset:0;
  border-radius:50%;
}
.sealRing svg{ width:100%; height:100%; transform:rotate(-90deg); }
.sealRing circle{
  fill:none;
  stroke:url(#ringGrad);
  stroke-width:1.4;
  stroke-dasharray:4 10;
  transform-box:fill-box;
  transform-origin:center;
  animation:spinRing 22s linear infinite;
}
@keyframes spinRing{ to{ transform:rotate(360deg); } }

.bigStartBtn{
  position:relative;
  width:78%; height:78%;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.25);
  font-family:"Playfair Display",serif;
  font-style:italic;
  font-size:clamp(20px,4.2vw,28px);
  font-weight:600;
  cursor:pointer;
  color:#2a1710;
  background:radial-gradient(circle at 32% 28%, #ffe3c2, var(--gold) 55%, #b8794a 100%);
  box-shadow:0 20px 70px rgba(230,140,90,.35), inset 0 2px 10px rgba(255,255,255,.5);
  animation:breathe 3.4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.035); }
}
.bigStartBtn:active{ transform:scale(.97); }

/* ETAP 2 */
.stage2{ background:transparent; }
.askBox{
  width:clamp(320px,86vw,620px);
  padding:clamp(26px,6vw,58px) clamp(24px,6vw,54px);
  border-radius:6px;
  background:linear-gradient(155deg, var(--glassFill), rgba(255,255,255,.02));
  border:1px solid var(--glassBorder);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  text-align:center;
  box-shadow:0 30px 90px rgba(0,0,0,.55);
  position:relative;
}
.askBox::before{
  content:"";
  position:absolute; inset:10px;
  border:1px solid rgba(230,185,141,.18);
  border-radius:2px;
  pointer-events:none;
}
.askEyebrow{
  font-size:clamp(12px,2.6vw,14px);
  letter-spacing:.4px;
  color:var(--gold);
  margin-bottom:10px;
}
.askTitle{
  font-family:"Playfair Display",serif;
  font-style:italic;
  font-weight:600;
  font-size:clamp(26px,5.6vw,42px);
  line-height:1.2;
  color:var(--text);
}
.askSubtitle{
  margin-top:14px;
  font-size:clamp(15px,3.2vw,19px);
  color:var(--muted);
  font-family:"Cormorant Garamond",serif;
}
.btnRow{
  margin-top:clamp(22px,4vw,36px);
  display:flex; justify-content:center;
  gap:clamp(12px,3vw,26px); flex-wrap:wrap;
}
.btn{
  padding:clamp(13px,3vw,17px) clamp(24px,5vw,40px);
  border-radius:999px;
  border:none;
  font-size:clamp(15px,3.2vw,18px);
  font-weight:700;
  cursor:pointer;
  box-shadow:0 16px 40px rgba(0,0,0,.35);
  transition:transform .15s ease;
  font-family:Poppins,sans-serif;
}
.btn:active{ transform:scale(.97); }
.yesBtn{ background:linear-gradient(135deg,var(--gold),var(--amber)); color:#2a1710; }
.noBtn{ background:rgba(255,255,255,.08); color:var(--text); border:1px solid rgba(255,255,255,.22); }

/* ===== ETAP 3 (IKONY) ===== */
.ui{ position:fixed; inset:0; z-index:20; pointer-events:none; }
.iconDock{
  position:fixed; inset:0;
  display:grid; place-items:center;
  z-index:30; pointer-events:auto;
}
.iconsGrid{
  width:min(980px,94vw);
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:clamp(14px,3vw,26px);
  padding:clamp(14px,3vw,18px);
}
@media (max-width:900px){ .iconsGrid{ grid-template-columns:repeat(3, minmax(0,1fr)); } }
@media (max-width:520px){ .iconsGrid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }

.appIcon{
  display:flex; flex-direction:column; align-items:center; gap:10px;
  opacity:0; transform:translateY(10px) scale(.985);
}
.appIcon.go{ animation:appIn .65s ease forwards; }
@keyframes appIn{ to{ opacity:1; transform:translateY(0) scale(1); } }

.iconBtn{
  width:clamp(78px,16vw,108px); height:clamp(78px,16vw,108px);
  border-radius:24px;
  border:1px solid var(--glassBorder);
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
  box-shadow:0 18px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  display:grid; place-items:center;
  cursor:pointer; user-select:none;
  transition:transform .15s ease, box-shadow .15s ease;
}
.iconBtn:hover{ transform:translateY(-3px); box-shadow:0 24px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.3); }
.iconBtn:active{ transform:scale(.97); }
.iconEmoji{ font-size:38px; line-height:1; filter:drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
.iconLabel{
  font-weight:600; color:#fff;
  font-size:clamp(12px,2.8vw,14px);
  text-align:center;
  text-shadow:0 4px 14px rgba(0,0,0,.9);
  font-family:"Cormorant Garamond",serif;
  letter-spacing:.3px;
}

/* ===== MODALE ===== */
.modal{
  position:fixed; inset:0; background:transparent;
  z-index:200; display:none; pointer-events:auto;
}
.modal.show{ display:grid; place-items:center; }

#letterModal{ background:transparent; }
#letterModal .modalCard{
  width:100%; height:100dvh; background:none; border:none;
  box-shadow:none; padding:0; overflow:visible;
}
#letterModal .letterShell{
  position:fixed; inset:0; height:100dvh;
  display:grid; place-items:center;
  padding-top:calc(16px + var(--safe-top));
  padding-bottom:calc(120px + var(--safe-bottom));
  padding-left:16px; padding-right:16px;
  box-sizing:border-box;
}

#albumModal{ background:rgba(4,2,8,.82); }
#albumModal .modalCard{
  width:min(720px, 92vw);
  max-width:720px;
  background:linear-gradient(160deg, rgba(20,10,30,.75), rgba(10,5,16,.85));
  border:1px solid var(--glassBorder);
  border-radius:20px;
  box-shadow:0 30px 100px rgba(0,0,0,.7);
  padding:clamp(14px,3vw,20px);
}
#albumModal .closeBtn{
  background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.28);
  color:#fff;
}
#albumModal .closeBtn:active{ transform:scale(.98); }

.closeBtn{
  position:absolute; top:14px; right:16px; z-index:20;
  border:none; cursor:pointer; background:transparent;
  color:#2a1710; font-size:26px; font-weight:700; line-height:1;
  width:36px; height:36px; border-radius:50%;
}
.closeBtn:active{ transform:scale(.95); }

/* ===== List ===== */
.letterShell{ width:100%; display:grid; place-items:center; padding:10px 0 14px; position:relative; }

.envelopeHero{
  width:min(620px,94vw);
  height:clamp(190px,36vw,320px);
  position:relative; margin:8px auto 0;
  display:grid; place-items:center;
}
.envVideo{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain; border-radius:22px; opacity:1;
  transform:translateZ(0);
  transition:opacity 1s ease, transform 1s ease;
  pointer-events:none;
}
.envVideo.fadeOut{ opacity:0; transform:translateY(14px) scale(.985); }

.paper{
  width:min(640px, 94vw);
  max-height:min(80dvh, 760px);
  height:auto;
  z-index:3;
  margin:0 auto;
  background:
    radial-gradient(circle at 100% 0%, rgba(230,185,141,.10), transparent 45%),
    linear-gradient(180deg, #fffaf4, var(--paper));
  color:var(--paperText);
  border-radius:8px;
  border:1px solid rgba(42,23,16,.10);
  box-shadow:0 40px 100px rgba(0,0,0,.55);
  padding:clamp(20px,4.5vw,40px);
  position:relative;
  overflow:auto; -webkit-overflow-scrolling:touch;
  opacity:1;
  transform:translateY(-8px) scale(1) rotate(-.35deg);
  transition:opacity 1s ease, transform 1s cubic-bezier(.2,.9,.2,1);
}
.paper::-webkit-scrollbar{ width:0; height:0; }
.paper{ scrollbar-width:none; }

.paper.isHidden{ opacity:0; transform:translateY(8px) scale(.92) rotate(-.35deg); pointer-events:none; visibility:hidden; }
.paper.show{ opacity:1; transform:translateY(-8px) scale(1) rotate(-.35deg); visibility:visible; }

.sealMark{
  width:46px; height:46px; margin:0 auto 6px;
  opacity:.85;
}

.paperTop{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:12px; flex-wrap:wrap;
}
.paperDate{
  font-size:12px; color:rgba(42,23,16,.55);
  font-weight:700; letter-spacing:.3px;
}
.paperTitle{
  font-family:"Great Vibes",cursive;
  font-size:var(--paper-title);
  margin:8px 0 4px; line-height:1.05;
  text-align:center;
}
.paperDivider{
  width:64px; height:1px; margin:6px auto 14px;
  background:linear-gradient(90deg, transparent, rgba(42,23,16,.4), transparent);
}
.paperBody{
  font-family:"Cormorant Garamond",serif;
  font-size:var(--paper-font);
  line-height:1.6;
}
.paperBody p{ margin:12px 0; }
.paperSign{
  margin-top:16px;
  font-family:"Great Vibes",cursive;
  font-size:clamp(22px,5vw,38px);
  text-align:right;
}

/* ===== Album ===== */
.albumCard{ overflow:visible; }
.albumScroller{
  max-height:76vh; overflow-y:auto;
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
  padding-right:6px; margin-top:54px;
}
.albumGrid{
  display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px;
}
@media (max-width:700px){ .albumGrid{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (max-width:420px){ .albumGrid{ grid-template-columns:repeat(1, minmax(0,1fr)); } }

.thumb{
  border-radius:14px; overflow:hidden; position:relative;
  background:rgba(255,255,255,.08);
  border:1px solid var(--glassBorder);
  box-shadow:0 14px 40px rgba(0,0,0,.4);
  aspect-ratio:1/1; cursor:pointer; user-select:none;
}
.thumb::after{
  content:""; position:absolute; inset:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  pointer-events:none;
}
.thumb img{
  width:100%; height:100%; object-fit:cover; display:block;
  opacity:0; transform:scale(1);
  transition:opacity .35s ease, transform .3s ease;
}
.thumb.loaded img{ opacity:1; }
.thumb:hover img{ transform:scale(1.05); }

/* ===== Lightbox ===== */
#lightbox{
  position:fixed; inset:0; background:rgba(4,2,8,.9);
  display:none; place-items:center; z-index:999; cursor:pointer; padding:18px;
}
#lightbox.show{ display:grid; }
#lightbox img{
  max-width:min(1200px,96vw); max-height:92vh;
  border-radius:14px; box-shadow:0 30px 90px rgba(0,0,0,.8);
  user-select:none;
}
.lbNav{
  position:fixed;
  top:50%; transform:translateY(-50%);
  width:52px; height:52px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(10,5,18,.55);
  color:#fff;
  font-size:30px;
  line-height:1;
  display:grid; place-items:center;
  cursor:pointer;
  z-index:1000;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.lbNav:active{ transform:translateY(-50%) scale(.92); }
.lbPrev{ left:clamp(10px,3vw,28px); }
.lbNext{ right:clamp(10px,3vw,28px); }
@media (max-width:560px){
  .lbNav{ width:44px; height:44px; font-size:24px; }
}

/* ===== ZEGAR ===== */
.bigTimer{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  pointer-events:none;
  padding:16px 16px calc(16px + var(--safe-bottom));
  display:flex; flex-direction:column; align-items:center; gap:12px;
}
.timerLabel{
  font-family:"Cormorant Garamond",serif;
  font-style:italic;
  font-weight:600;
  color:var(--gold);
  text-align:center;
  font-size:clamp(13px,3.4vw,15px);
  text-shadow:0 4px 16px rgba(0,0,0,.85), 0 1px 3px rgba(0,0,0,.9);
  max-width:92vw;
}
.timerGrid{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.tChip{
  min-width:72px; padding:10px 12px; border-radius:10px;
  background:rgba(10,5,18,.5);
  border:1px solid var(--glassBorder);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 18px 60px rgba(0,0,0,.4);
  display:grid; place-items:center;
}
.tN{ font-weight:700; font-size:18px; line-height:1; color:var(--text); font-family:"Playfair Display",serif; }
.tL{ margin-top:4px; font-size:11px; color:var(--muted); font-weight:600; font-family:"Cormorant Garamond",serif; }

  </style>
</head>

<body>
  <video id="bgVideo" muted loop playsinline preload="auto">
    <source src="background.mp4" type="video/mp4">
  </video>

  <div class="auroraLayer" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
  </div>
  <canvas id="emberCanvas" aria-hidden="true"></canvas>
  <div class="spotlight" id="spotlight" aria-hidden="true"></div>

  <!-- ETAP 1 -->
  <div id="stage1" class="stage stage1">
    <div class="seal">
      <div class="sealRing">
        <svg viewBox="0 0 100 100">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffe3c2"/>
              <stop offset="100%" stop-color="#e6b98d"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="48"/>
        </svg>
      </div>
      <button id="startBigBtn" class="bigStartBtn">Kliknij</button>
    </div>
  </div>

  <!-- ETAP 2 -->
  <div id="stage2" class="stage stage2 hidden">
    <div class="askBox">
      <div class="askEyebrow">zanim zrobimy kolejny krok</div>
      <div class="askTitle">Chcę Cię o coś zapytać</div>
      <div class="askSubtitle">Czy zgodzisz się być moją dziewczyną?</div>
      <div class="btnRow">
        <button id="yesBtn" class="btn yesBtn">Tak</button>
        <button id="noBtn" class="btn noBtn">Nie</button>
      </div>
    </div>
  </div>

  <!-- ETAP 3 -->
  <div class="ui">
    <div class="iconDock hidden" id="iconDock" aria-hidden="true">
      <div class="iconsGrid" id="iconsGrid"></div>
    </div>
  </div>

  <div id="bigTimer" class="bigTimer hidden" aria-hidden="true">
    <div class="timerLabel" id="timerLabel">⏳</div>
    <div class="timerGrid">
      <div class="tChip"><div class="tN" id="d">—</div><div class="tL">dni</div></div>
      <div class="tChip"><div class="tN" id="h">—</div><div class="tL">godzin</div></div>
      <div class="tChip"><div class="tN" id="m">—</div><div class="tL">min</div></div>
      <div class="tChip"><div class="tN" id="s">—</div><div class="tL">sek</div></div>
    </div>
  </div>

  <!-- MODAL: LIST -->
  <div class="modal" id="letterModal" aria-hidden="true">
    <div class="modalCard" role="dialog" aria-modal="true">
      <button class="closeBtn" id="closeLetter" type="button">✕</button>
      <div class="letterShell">
        <div class="envelopeHero" id="envelopeHero">
          <video id="envVideo" class="envVideo" muted playsinline preload="auto">
            <source src="envelope.mp4" type="video/mp4">
          </video>
        </div>
        <div class="paper isHidden" id="paper">
          <svg class="sealMark" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="22" fill="none" stroke="#c88a5a" stroke-width="1"/>
            <path d="M24 12 C 27 18, 33 18, 33 24 C 33 30, 27 30, 24 36 C 21 30, 15 30, 15 24 C 15 18, 21 18, 24 12 Z" fill="#c88a5a" opacity=".8"/>
          </svg>
          <div class="paperTop">
            <div class="paperDate" id="paperDate">—</div>
          </div>
          <div class="paperTitle" id="paperTitle">—</div>
          <div class="paperDivider"></div>
          <div class="paperBody" id="paperBody"></div>
          <div class="paperSign" id="paperSign">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: ALBUM -->
  <div class="modal" id="albumModal" aria-hidden="true">
    <div class="modalCard albumCard" role="dialog" aria-modal="true">
      <button class="closeBtn" id="closeAlbum" type="button">✕</button>
      <div class="albumScroller" id="albumScroller">
        <div class="albumGrid" id="albumGrid"></div>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" aria-hidden="true">
    <button class="lbNav lbPrev" id="lbPrev" type="button" aria-label="Poprzednie zdjęcie">‹</button>
    <img id="lightboxImg" alt="Powiększone zdjęcie">
    <button class="lbNav lbNext" id="lbNext" type="button" aria-label="Następne zdjęcie">›</button>
  </div>

  <audio id="music" preload="auto" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const stage1 = document.getElementById("stage1");
  const stage2 = document.getElementById("stage2");
  const startBtn = document.getElementById("startBigBtn");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn  = document.getElementById("noBtn");

  const bgVideo = document.getElementById("bgVideo");
  const music = document.getElementById("music");

  const iconDock = document.getElementById("iconDock");
  const iconsGrid = document.getElementById("iconsGrid");

  const letterModal = document.getElementById("letterModal");
  const albumModal = document.getElementById("albumModal");
  const closeLetter = document.getElementById("closeLetter");
  const closeAlbum = document.getElementById("closeAlbum");

  const paper = document.getElementById("paper");
  const paperDate = document.getElementById("paperDate");
  const paperTitle = document.getElementById("paperTitle");
  const paperBody  = document.getElementById("paperBody");
  const paperSign  = document.getElementById("paperSign");

  const albumGrid = document.getElementById("albumGrid");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lbPrev = document.getElementById("lbPrev");
  const lbNext = document.getElementById("lbNext");

  const spotlight = document.getElementById("spotlight");

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Kliknij / Dotknij
  function isTouch(){
    return matchMedia("(pointer:coarse)").matches && !matchMedia("(pointer:fine)").matches;
  }
  function updateStartText(){ startBtn.textContent = isTouch() ? "Dotknij" : "Kliknij"; }
  updateStartText();
  addEventListener("resize", updateStartText);
  addEventListener("orientationchange", updateStartText);

  // Spotlight kursora (tylko desktop / pointer:fine)
  if(!isTouch() && !reduceMotion){
    spotlight.classList.add("on");
    addEventListener("pointermove", (e)=>{
      spotlight.style.setProperty("--sx", e.clientX + "px");
      spotlight.style.setProperty("--sy", e.clientY + "px");
    });
  }

  // ===== Cząstki (embery) =====
  const canvas = document.getElementById("emberCanvas");
  const ctx = canvas.getContext("2d");
  let W, H, particles = [];

  function resize(){
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
  }
  resize();
  addEventListener("resize", resize);

  const PCOUNT = reduceMotion ? 0 : (isTouch() ? 26 : 42);
  function makeParticle(){
    return {
      x: Math.random()*W,
      y: Math.random()*H + H*0.2,
      r: Math.random()*2 + 0.6,
      speed: Math.random()*0.35 + 0.08,
      drift: (Math.random()-0.5)*0.3,
      alpha: Math.random()*0.5 + 0.15,
      hue: Math.random() > 0.5 ? "230,185,141" : "255,143,168"
    };
  }
  for(let i=0;i<PCOUNT;i++) particles.push(makeParticle());

  function tick(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(p=>{
      p.y -= p.speed;
      p.x += p.drift;
      if(p.y < -10){ p.y = H + 10; p.x = Math.random()*W; }
      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.hue},${p.alpha})`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  if(PCOUNT > 0) requestAnimationFrame(tick);

  // Muzyka
  const MUSIC_VOL = 0.25;
  const clamp01 = (v)=> Math.max(0, Math.min(1, v));
  function fadeTo(el, target, ms=900){
    const to = clamp01(target);
    const from = clamp01(el.volume ?? 0);
    const t0 = performance.now();
    const step = (t)=>{
      const k = Math.min(1, (t - t0)/ms);
      el.volume = clamp01(from + (to - from)*k);
      if(k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // Timer (22.09.2026, godz. 22:00 — początek naszej historii)
  const startDate = new Date(2026, 8, 22, 22, 0, 0);
  const dEl = document.getElementById("d");
  const hEl = document.getElementById("h");
  const mEl = document.getElementById("m");
  const sEl = document.getElementById("s");
  const timerLabel = document.getElementById("timerLabel");
  const bigTimer = document.getElementById("bigTimer");
  const pad2 = (n)=> String(n).padStart(2,"0");

  function updateTimer(){
    const now = new Date();
    let diff = now - startDate;
    let future = diff < 0;
    if(future) diff = Math.abs(diff);

    const totalSec = Math.floor(diff/1000);
    const days = Math.floor(totalSec/86400);
    const hours = Math.floor((totalSec%86400)/3600);
    const mins  = Math.floor((totalSec%3600)/60);
    const secs  = totalSec%60;

    if(dEl) dEl.textContent = days;
    if(hEl) hEl.textContent = pad2(hours);
    if(mEl) mEl.textContent = pad2(mins);
    if(sEl) sEl.textContent = pad2(secs);

    if(timerLabel){
      timerLabel.textContent = future
        ? "Do tej chwili zostało jeszcze trochę…"
        : "Jesteśmy razem już tyle czasu";
    }
  }
  setInterval(updateTimer, 1000);
  updateTimer();

  // Etap 1 -> 2
  function goStage2(){
    stage1.classList.add("hidden");
    stage2.classList.remove("hidden");
  }
  startBtn.addEventListener("click", goStage2);
  startBtn.addEventListener("touchstart", (e)=>{ e.preventDefault(); goStage2(); }, {passive:false});
  startBtn.addEventListener("pointerup", goStage2);

  // Etap 2: zmiana tekstów na "Nie"
  let noCount = 0;
  const noPhrases = ["Nie","Na pewno nie 😏","Spróbuj jeszcze raz","Prawie 😳","No dobrze…"];
  noBtn.addEventListener("click", () => {
    if(noCount >= noPhrases.length - 1){
      noBtn.textContent = "Tak <3";
      noBtn.style.background = "linear-gradient(135deg,var(--gold),var(--amber))";
      noBtn.style.color = "#2a1710";
      noBtn.style.border = "0";
      noBtn.onclick = goStage3;
      return;
    }
    noBtn.textContent = noPhrases[++noCount];
  });

  yesBtn.addEventListener("click", goStage3);

  // ===== LIST — początek naszej historii =====
  const letters = [
    {
      id: "start-2026-09-22",
      date: "22.09.2026",
      emoji: "💫",
      title: "Nasz początek",
      body: [
        "Może nasze poznanie było zwykłym przypadkiem, a może przeznaczeniem ale ten dzień stał sie dal mnie poczatkięm czegoś pieknego",
        "Od naszego pierwszego spotkania patrzę na świat trochę inaczej. Widzę więcej kolorów, częściej się uśmiecham, a każda rozmowa z Tobą jest jak powrót do domu.",
        "Mam nadzieję, że to ostatni raz, kiedy się zakocham — bo nie chcę już nigdzie indziej szukać tego, co znalazłem w Tobie.",
        "Dziękuję, że zgodziłaś się zacząć tę historię razem ze mną. To dopiero pierwszy rozdział, a ja już wiem, że każdy kolejny chcę pisać z Tobą do końca. 💞"
      ],
      sign: "– Mateusz"
    }
  ];

  function parsePLDate(d){
    const [dd,mm,yyyy] = d.split(".").map(Number);
    return new Date(yyyy, mm-1, dd);
  }
  letters.sort((a,b)=> parsePLDate(a.date) - parsePLDate(b.date));

  // ===== ZDJĘCIA =====
  const photoFiles = Array.from({length:11}, (_,i)=> `photos/${String(i+1).padStart(2,"0")}.jpg`);

  // ===== IKONY =====
  function buildIcons(){
    iconsGrid.innerHTML = "";

    iconsGrid.appendChild(makeAppIcon({
      id: "album",
      emoji: "📖",
      label: "Album",
      onClick: openAlbum
    }));

    letters.forEach((L)=>{
      iconsGrid.appendChild(makeAppIcon({
        id: L.id,
        emoji: L.emoji || "💌",
        label: L.date,
        onClick: ()=> openLetter(L.id)
      }));
    });
  }

  function makeAppIcon({id, emoji, label, onClick}){
    const wrap = document.createElement("div");
    wrap.className = "appIcon";
    wrap.dataset.id = id;

    const btn = document.createElement("button");
    btn.className = "iconBtn";
    btn.type = "button";
    btn.setAttribute("aria-label", label);

    const em = document.createElement("div");
    em.className = "iconEmoji";
    em.textContent = emoji;

    const lab = document.createElement("div");
    lab.className = "iconLabel";
    lab.textContent = label;

    btn.appendChild(em);
    wrap.appendChild(btn);
    wrap.appendChild(lab);

    btn.addEventListener("click", onClick);
    return wrap;
  }

  function revealIconsStagger(){
    const items = Array.from(document.querySelectorAll(".appIcon"));
    items.forEach((el, i)=>{
      setTimeout(()=> el.classList.add("go"), 3000 + i * 1000);
    });
  }

  // ===== LIST MODAL =====
  function renderLetter(L){
    paperDate.textContent = L.date;
    paperTitle.textContent = L.title;
    paperSign.textContent = L.sign;

    paperBody.innerHTML = "";
    L.body.forEach(t=>{
      const p = document.createElement("p");
      p.textContent = t;
      paperBody.appendChild(p);
    });
  }

  function openLetter(id){
    const L = letters.find(x=>x.id === id) || letters[0];
    renderLetter(L);

    paper.classList.add("isHidden");
    paper.classList.remove("show");

    letterModal.classList.add("show");
    letterModal.setAttribute("aria-hidden","false");

    requestAnimationFrame(()=>{
      paper.classList.remove("isHidden");
      paper.classList.add("show");
    });
  }

  function closeLetterModal(){
    letterModal.classList.remove("show");
    letterModal.setAttribute("aria-hidden","true");
    paper.classList.add("isHidden");
    paper.classList.remove("show");
  }

  closeLetter.addEventListener("click", (e)=>{ e.stopPropagation(); closeLetterModal(); });
  letterModal.addEventListener("click", (e)=>{
    if(e.target === letterModal) closeLetterModal();
  });

  // ===== ALBUM MODAL =====
  function buildAlbum(){
    albumGrid.innerHTML = "";
    photoFiles.forEach((src, idx)=>{
      const div = document.createElement("div");
      div.className = "thumb";
      div.setAttribute("role","button");
      div.setAttribute("tabindex","0");
      div.setAttribute("aria-label", `Otwórz zdjęcie ${idx+1}`);

      const img = document.createElement("img");
      img.alt = `Zdjęcie ${idx+1}`;
      img.src = src;
      img.addEventListener("load", ()=> div.classList.add("loaded"));
      img.addEventListener("error", ()=> div.classList.remove("loaded"));

      const open = ()=> openLightbox(src, img.alt, idx);
      div.addEventListener("click", open);
      div.addEventListener("keydown", (e)=>{
        if(e.key === "Enter" || e.key === " "){
          e.preventDefault();
          open();
        }
      });

      div.appendChild(img);
      albumGrid.appendChild(div);
    });
  }

  function openAlbum(){
    albumModal.classList.add("show");
    albumModal.setAttribute("aria-hidden","false");
  }
  function closeAlbumModal(){
    albumModal.classList.remove("show");
    albumModal.setAttribute("aria-hidden","true");
  }
  closeAlbum.addEventListener("click", (e)=>{ e.stopPropagation(); closeAlbumModal(); });
  albumModal.addEventListener("click", (e)=>{
    if(e.target === albumModal) closeAlbumModal();
  });

  // ===== LIGHTBOX =====
  let lbIndex = 0;

  function showLightboxAt(idx){
    if(idx < 0) idx = photoFiles.length - 1;
    if(idx >= photoFiles.length) idx = 0;
    lbIndex = idx;
    lightboxImg.src = photoFiles[lbIndex];
    lightboxImg.alt = `Zdjęcie ${lbIndex+1}`;
  }

  function openLightbox(src, alt, idx){
    showLightboxAt(idx ?? photoFiles.indexOf(src));
    lightbox.classList.add("show");
    lightbox.setAttribute("aria-hidden","false");
  }
  function closeLightbox(){
    lightbox.classList.remove("show");
    lightbox.setAttribute("aria-hidden","true");
  }
  function lbPrevImg(e){ e && e.stopPropagation(); showLightboxAt(lbIndex - 1); }
  function lbNextImg(e){ e && e.stopPropagation(); showLightboxAt(lbIndex + 1); }

  lbPrev.addEventListener("click", lbPrevImg);
  lbNext.addEventListener("click", lbNextImg);

  // klik w samo zdjęcie / tło zamyka; klik w strzałki nie
  lightbox.addEventListener("click", (e)=>{
    if(e.target === lightbox || e.target === lightboxImg) closeLightbox();
  });

  // przesuwanie palcem (swipe)
  let touchStartX = null;
  lightbox.addEventListener("touchstart", (e)=>{
    touchStartX = e.changedTouches[0].clientX;
  }, {passive:true});
  lightbox.addEventListener("touchend", (e)=>{
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){
      if(dx < 0) lbNextImg(); else lbPrevImg();
    }
    touchStartX = null;
  }, {passive:true});

  addEventListener("keydown", (e)=>{
    if(lightbox.classList.contains("show")){
      if(e.key === "Escape") closeLightbox();
      else if(e.key === "ArrowLeft") lbPrevImg();
      else if(e.key === "ArrowRight") lbNextImg();
      return;
    }
    if(e.key !== "Escape") return;
    if(letterModal.classList.contains("show")) closeLetterModal();
    else if(albumModal.classList.contains("show")) closeAlbumModal();
  });

  // ===== Etap 3 =====
  function goStage3(){
    stage2.classList.add("hidden");

    bgVideo.style.opacity = 1;
    bgVideo.play().catch(()=>{});

    music.currentTime = 0;
    music.volume = 0;
    music.play().catch(()=>{});
    fadeTo(music, MUSIC_VOL, 900);

    buildIcons();
    buildAlbum();

    iconDock.classList.remove("hidden");
    iconDock.setAttribute("aria-hidden","false");

    revealIconsStagger();

    if(bigTimer){
      bigTimer.classList.remove("hidden");
      bigTimer.setAttribute("aria-hidden","false");
    }
  }

});
</script>
</body>
</html>
